# Saves the sample vendor price lists (bot/test/fixtures/prices-*.txt) into Harga pasar as test data, marked
# sample, or deletes them again. Runs when ACTION below changes (save, then later wipe), or by hand.
# The log shows counts and vendor names only.
name: Sample market prices

on:
  push:
    branches: [main]
    paths: ['.github/workflows/sample-prices.yml']
  workflow_dispatch:
    inputs:
      action:
        description: 'save or wipe'
        default: 'save'

env:
  ACTION: save

jobs:
  run:
    if: github.repository == 'threetwotwo/durengrs'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --silent
      - name: Save or wipe
        env:
          BOT_ENV_YAML: ${{ secrets.BOT_ENV_YAML }}
          BOT_SERVICE_ACCOUNT: ${{ secrets.BOT_SERVICE_ACCOUNT }}
          WHAT: ${{ inputs.action || env.ACTION }}
        run: |
          printf '%s\n' "$BOT_ENV_YAML" > env.yaml
          printf '%s\n' "$BOT_SERVICE_ACCOUNT" > service-account.json
          node scripts/sample-prices.js "$WHAT"; code=$?
          rm -f env.yaml service-account.json
          exit $code
