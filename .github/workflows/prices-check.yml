# Runs the price reader on a sample vendor list (bot/test/fixtures/prices-<name>.txt) and prints what it read.
# Vendors' public price lists only; nothing is saved. Started by a change to this file, or by hand.
name: Price reading check

on:
  push:
    branches: [main]
    paths: ['.github/workflows/prices-check.yml']
  workflow_dispatch:
    inputs:
      fixture:
        description: 'Sample name (bot/test/fixtures/prices-<name>.txt)'
        default: 'william'

jobs:
  read:
    if: github.repository == 'threetwotwo/durengrs'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the sample
        env:
          BOT_ENV_YAML: ${{ secrets.BOT_ENV_YAML }}
          FIXTURE: ${{ inputs.fixture || 'william' }}
        run: |
          TOKEN=$(printf '%s\n' "$BOT_ENV_YAML" | sed -n 's/^VERIFY_TOKEN:[[:space:]]*//p' | head -1 | tr -d '\r' | sed -e 's/^["'"'"']//' -e 's/["'"'"'][[:space:]]*$//')
          echo "::add-mask::$TOKEN"
          curl -sS --max-time 120 -G "https://durian-tree-lookup-239637876270.asia-southeast1.run.app/prices-test" \
            --data-urlencode "token=$TOKEN" --data-urlencode "fixture=$FIXTURE" -o out.json -w 'HTTP %{http_code}\n'
          jq -r '.error // empty' out.json
          jq -r '"\(.n) prices"' out.json
          jq -r '.prices[] | [.date, .vendor, (.category // "buah"), .variety, (.varietyCode // "-"), (.form // "-"), (.origin // "-"), (.condition // "-"), (.grade // "-"), .price, .unit, (.fruitKg // "-"), (.pricePerKg // "-"), (.available // "-"), (.product // "-"), (.size // "-")] | map(tostring) | join(" | ")' out.json
